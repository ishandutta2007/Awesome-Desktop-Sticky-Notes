<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Sticky Note Gradients -->
    <linearGradient id="yellowNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="pinkNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cyanNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    
    /* Background Dynamic Floating Notes */
    .float-note-1 {
      animation: float1 8s ease-in-out infinite alternate;
      transform-origin: center;
      opacity: 0.25;
    }
    .float-note-2 {
      animation: float2 10s ease-in-out infinite alternate;
      transform-origin: center;
      opacity: 0.2;
    }
    .float-note-3 {
      animation: float3 9s ease-in-out infinite alternate;
      transform-origin: center;
      opacity: 0.25;
    }

    @keyframes float1 {
      0% { transform: translateY(0px) rotate(-6deg); }
      100% { transform: translateY(-18px) rotate(2deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(8deg); }
      100% { transform: translateY(-22px) rotate(-4deg); }
    }
    @keyframes float3 {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-15px) rotate(7deg); }
    }

    /* Foreground Typography */
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    .pin { fill: #ef4444; }
  </style>

  <!-- Background -->
  <rect width="900" height="240" rx="12" class="bg"/>

  <!-- Subtle Dynamic Background Elements (Floating Notes placed away from main text center) -->
  <g class="float-note-1">
    <rect x="50" y="30" width="90" height="90" rx="6" fill="url(#yellowNote)" filter="url(#shadow)"/>
    <line x1="65" y1="50" x2="115" y2="50" stroke="#854d0e" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="65" x2="105" y2="65" stroke="#854d0e" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="80" x2="95" y2="80" stroke="#854d0e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="95" cy="38" r="4" class="pin"/>
  </g>

  <g class="float-note-2">
    <rect x="760" y="25" width="95" height="95" rx="6" fill="url(#pinkNote)" filter="url(#shadow)"/>
    <line x1="775" y1="45" x2="835" y2="45" stroke="#9d174d" stroke-width="3" stroke-linecap="round"/>
    <line x1="775" y1="60" x2="820" y2="60" stroke="#9d174d" stroke-width="3" stroke-linecap="round"/>
    <line x1="775" y1="75" x2="840" y2="75" stroke="#9d174d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="807" cy="33" r="4" class="pin"/>
  </g>

  <g class="float-note-3">
    <rect x="790" y="130" width="80" height="80" rx="6" fill="url(#cyanNote)" filter="url(#shadow)"/>
    <line x1="803" y1="150" x2="850" y2="150" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="803" y1="163" x2="840" y2="163" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="830" cy="138" r="4" class="pin"/>
  </g>

  <!-- Central Foreground Content (Guaranteed crisp visibility) -->
  <g transform="translate(60, 0)">
    <!-- Decorative Icon / Logo Motif -->
    <g transform="translate(0, 50)" filter="url(#shadow)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#yellowNote)" transform="rotate(-6 30 30)"/>
      <rect x="10" y="8" width="60" height="60" rx="8" fill="url(#purpleNote)" transform="rotate(4 40 38)"/>
      <!-- Pin -->
      <circle cx="42" cy="14" r="5" fill="#dc2626"/>
      <circle cx="40" cy="12" r="2" fill="#fca5a5"/>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="90" y="82" class="title">Awesome Desktop Sticky Notes 📌</text>
    <text x="90" y="115" class="subtitle">Curated list of commercial SaaS products &amp; open-source sticky note tools</text>
    <text x="90" y="138" class="subtitle">Quick capture, desktop widgets, Markdown notes &amp; self-hosted sync</text>

    <!-- Category Pill Badges in Foreground -->
    <g transform="translate(90, 160)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="67" y="18" text-anchor="middle" class="badge-text">⚡ Quick Capture</text>

      <!-- Pill 2 -->
      <rect x="147" y="0" width="145" height="28" rx="14" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5"/>
      <text x="219" y="18" text-anchor="middle" class="badge-text">🖥️ Desktop Widgets</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="150" height="28" rx="14" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.5"/>
      <text x="379" y="18" text-anchor="middle" class="badge-text">📝 Markdown Support</text>

      <!-- Pill 4 -->
      <rect x="466" y="0" width="145" height="28" rx="14" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="538" y="18" text-anchor="middle" class="badge-text">🔓 Open Source</text>
    </g>
  </g>
</svg>
