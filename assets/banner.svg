<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 240"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="yellowNote" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fde047"/></linearGradient><linearGradient id="pinkNote" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="cyanNote" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a5f3fc"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="purpleNote" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#e9d5ff"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="shadow" width="130%" height="130%" x="-10%" y="-10%"><feDropShadow dx="2" dy="8" flood-color="#000" flood-opacity=".4" stdDeviation="6"/></filter></defs><style>@keyframes float1{0%{transform:translateY(0) rotate(-6deg)}}@keyframes float2{0%{transform:translateY(0) rotate(8deg)}}@keyframes float3{0%{transform:translateY(0) rotate(-3deg)}}.bg{fill:url(#bgGrad)}.float-note-1{animation:float1 8s ease-in-out infinite alternate;transform-origin:center;opacity:.25}.float-note-2,.float-note-3{animation:float2 10s ease-in-out infinite alternate;transform-origin:center;opacity:.2}.float-note-3{animation:float3 9s ease-in-out infinite alternate;opacity:.25}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:38px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:17px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:13px;fill:#f8fafc}.pin{fill:#ef4444}</style><rect width="900" height="240" class="bg" rx="12"/><g class="float-note-1"><rect width="90" height="90" x="50" y="30" fill="url(#yellowNote)" filter="url(#shadow)" rx="6"/><line x1="65" x2="115" y1="50" y2="50" stroke="#854d0e" stroke-linecap="round" stroke-width="3"/><line x1="65" x2="105" y1="65" y2="65" stroke="#854d0e" stroke-linecap="round" stroke-width="3"/><line x1="65" x2="95" y1="80" y2="80" stroke="#854d0e" stroke-linecap="round" stroke-width="3"/><circle cx="95" cy="38" r="4" class="pin"/></g><g class="float-note-2"><rect width="95" height="95" x="760" y="25" fill="url(#pinkNote)" filter="url(#shadow)" rx="6"/><line x1="775" x2="835" y1="45" y2="45" stroke="#9d174d" stroke-linecap="round" stroke-width="3"/><line x1="775" x2="820" y1="60" y2="60" stroke="#9d174d" stroke-linecap="round" stroke-width="3"/><line x1="775" x2="840" y1="75" y2="75" stroke="#9d174d" stroke-linecap="round" stroke-width="3"/><circle cx="807" cy="33" r="4" class="pin"/></g><g class="float-note-3"><rect width="80" height="80" x="790" y="130" fill="url(#cyanNote)" filter="url(#shadow)" rx="6"/><line x1="803" x2="850" y1="150" y2="150" stroke="#0369a1" stroke-linecap="round" stroke-width="3"/><line x1="803" x2="840" y1="163" y2="163" stroke="#0369a1" stroke-linecap="round" stroke-width="3"/><circle cx="830" cy="138" r="4" class="pin"/></g><g><g filter="url(#shadow)" transform="translate(60, 0) translate(0, 50)"><rect width="60" height="60" x="0" y="0" fill="url(#yellowNote)" rx="8" transform="rotate(-6 30 30)"/><rect width="60" height="60" x="10" y="8" fill="url(#purpleNote)" rx="8" transform="rotate(4 40 38)"/><circle cx="42" cy="14" r="5" fill="#dc2626"/><circle cx="40" cy="12" r="2" fill="#fca5a5"/></g><text x="90" y="82" class="title" transform="translate(60, 0)">Awesome Desktop Sticky Notes 📌</text><text x="90" y="115" class="subtitle" transform="translate(60, 0)">Curated list of commercial SaaS products &amp; open-source sticky note tools</text><text x="90" y="138" class="subtitle" transform="translate(60, 0)">Quick capture,